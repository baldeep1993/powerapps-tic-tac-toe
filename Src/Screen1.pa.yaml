Screens:
  Screen1:
    Properties:
      Fill: =RGBA(214, 221, 224, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Gallery1:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =339
            Items: =varSequence
            OnSelect: |-
              =If(
                  CountRows(playerSelection) < 3,
                  Collect(
                      playerSelection,
                      ThisItem.Value
                  );
                  Update(
                      varSequence,
                      ThisItem,
                      {Value: 99}
                  ),
                  Notify(
                      "You cannot select any more cells. Let COM play his/her turn.",
                      NotificationType.Information,
                      1000
                  )
              )
            ShowScrollbar: =false
            TemplateSize: =101
            Transition: =Transition.Pop
            Width: =383
            WrapCount: =3
            X: =99
            Y: =171
          Children:
            - Label1:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(237, 237, 237, 1)
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Text: =If(ThisItem.Value = 99,"X",ThisItem.Value)
                  Width: =Parent.TemplateWidth
                  Y: '=0   '
            - Button2:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  Height: =101
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: =Select(Parent)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =20
                  Text: |-
                    =If(
                        ThisItem.Value = 99,
                        "X",
                        If(
                            ThisItem.Value = 88,
                            "O"
                        )
                    )
                  Width: =121
      - Button1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =50
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  Value(
                      Concat(
                          Sort(
                              playerSelection,
                              ThisRecord.Value,
                              SortOrder.Ascending
                          ),
                          ThisRecord.Value,
                          ""
                      )
                  ) in winningCord,
                  Notify(
                      "User won",
                      NotificationType.Success
                  ),
                  Notify(
                      "User lost",
                      NotificationType.Information
                  )
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Won/Lost/Draw"
            Width: =198
            X: =1147
            Y: =640
      - Table1:
          Control: Table@1.0.278
          Properties:
            Height: =339
            Items: =playerSelection
            Width: =249
            X: =1117
            Y: =171
          Children:
            - Value1:
                Control: TableDataField@1.5.0
                Variant: textualColumn
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Value"
                  FieldName: ="Value"
                  FieldType: ="n"
                  Order: =1
      - Button3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |
              =ClearCollect(
                  remainingPlaces,
                  Filter(
                      varSequence,
                      Value <> 99
                  )
              );
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Com Turn"
            X: =66
            Y: =690
      - Button4:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =UpdateContext(
                  {
                      randomNumber: RandBetween(
                          1,
                          9
                      )
                  }
              );
              If(
                  randomNumber in remainingPlaces,Update(varSequence,{Value:randomNumber},{Value:88})
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: =randomNumber
            X: =281
            Y: =690
      - Header1:
          Control: Header@0.0.44
          Properties:
            BasePaletteColor: =RGBA(168, 110, 235, 1)
            Fill: =RGBA(135, 89, 189, 1)
            Logo: ='566294'
            Style: ='Header.Style'.Neutral
            Title: ="First Draft of Tic-Tac-Toe"
