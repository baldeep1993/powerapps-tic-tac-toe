Screens:
  Screen3:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(showgif,false);Set(showgif,true);
        Concurrent(
            ClearCollect(
                varSequence,
                Sequence(
                    9,
                    1,
                    1
                )
            ),
            ClearCollect(
                winningCord,
                {ID: 123},
                {ID: 147},
                {ID: 159},
                {ID: 789},
                {ID: 369},
                {ID: 456},
                {ID: 258},
                {ID: 357}
            ),
            Clear(playerSelection),
            Clear(comRandomNumbers),UpdateContext({comturncounter:0}),UpdateContext({playerTurnCounter:0})
        )
    Children:
      - Grid1:
          Control: GroupContainer@1.5.0
          Variant: GridLayout
          Properties:
            Fill: =ColorFade(Button2.Fill,0.85)
            Height: =Parent.Height
            LayoutGap: =16
            LayoutGridColumns: =10
            LayoutGridRows: =8
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - HeaderContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(85, 60, 43, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGridColumnEnd: =-1
                  LayoutGridColumnStart: =1
                  LayoutGridRowEnd: =1
                  LayoutGridRowStart: =1
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  X: =40
                  Y: =40
                Children:
                  - Header1:
                      Control: Header@0.0.44
                      Properties:
                        BasePaletteColor: =RGBA(167, 127, 91, 1)
                        Fill: =RGBA(85, 60, 43, 1)
                        Font: =Font.'Segoe UI'
                        FontColor: =RGBA(255, 255, 255, 1)
                        Logo: ='566294'
                        OnSelectLogo: =Navigate('Welcome Screen',ScreenTransition.CoverRight)
                        Style: ='Header.Style'.Neutral
                        Title: ="Tic-Tac-Toe"
                        TitleFontSize: =30
            - SidebarContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGridColumnEnd: =6
                  LayoutGridColumnStart: =1
                  LayoutGridRowEnd: =9
                  LayoutGridRowStart: =2
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  X: =40
                  Y: =40
                Children:
                  - Container1:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - Rectangle2:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =ColorFade(Button2.Fill,0.65)
                              Width: =Parent.Width
                              Y: =526
                        - Gallery1:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =376
                              Items: =varSequence
                              OnSelect: |-
                                =//ClearCollect(noduplicateselection,Filter(varSequence,Value<>99 && Value<>88));
                                If(
                                    CountRows(playerSelection) < 3,
                                    If(
                                        ThisItem.Value = 99 || ThisItem.Value = 88,
                                        Notify("Please make a different selection as the cell is already taken",NotificationType.Warning),    
                                        UpdateContext({playerTurnCounter:playerTurnCounter+1});Collect(playerSelection,ThisItem.Value);Update(varSequence,ThisItem,{Value: 99})
                                    ),
                                    Notify(
                                        "You cannot select any more cells. Let COM play his/her turn.",
                                        NotificationType.Information,
                                        1000
                                    )
                                )
                              TemplatePadding: =0
                              TemplateSize: =124
                              Transition: =Transition.Pop
                              Width: =450
                              WrapCount: =3
                              X: =95
                              Y: =39
                            Children:
                              - Label1:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Fill: =RGBA(237, 237, 237, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    Text: =ThisItem.Value
                                    Width: =Parent.TemplateWidth
                                    Y: '=0   '
                              - Button2:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ColorFade(Self.Fill, -15%)
                                    Color: =If(Self.Text = "X",Color.Black,Color.White)
                                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                                    Fill: =RGBA(167, 127, 91, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.TemplateHeight
                                    HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                                    OnSelect: =Select(Parent)
                                    PressedBorderColor: =Self.Fill
                                    PressedColor: =Self.Fill
                                    PressedFill: =Self.Color
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =40
                                    Text: |-
                                      =If(
                                          ThisItem.Value = 99,
                                          "X",
                                          If(
                                              ThisItem.Value = 88,
                                              "O"
                                          )
                                      )
                                    Width: =Parent.TemplateWidth
                              - Rectangle1:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Fill: =RGBA(230, 213, 195, 1)
                                    Height: =3
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                                    Y: =121
                              - Rectangle1_1:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Fill: =RGBA(230, 213, 195, 1)
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    Width: =3
                                    X: =147
                        - btn_result:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              DisplayMode: |-
                                =If(
                                    Count(playerSelection) = 3 && Count(comRandomNumbers) = 3,
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              Fill: =Button2.Fill
                              Font: =Font.Arial
                              Height: =50
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              OnSelect: |-
                                =If(
                                    Value(Concat(Sort(playerSelection,ThisRecord.Value,SortOrder.Ascending),
                                            ThisRecord.Value,
                                            "")) in winningCord,
                                    Notify(
                                        "User won",
                                        NotificationType.Success
                                    ),
                                    If(Value(Concat(Sort(comRandomNumbers,ThisRecord.Value,SortOrder.Ascending),"")) in winningCord,
                                    Notify("COM Won the game",NotificationType.Information),Notify("Draw",NotificationType.Information)
                                    )
                                )
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Text: ="Won/Lost/Draw"
                              Tooltip: ="Disabled because Player or Computer turn is not equal to 3"
                              Visible: =false
                              Width: =198
                              X: =222
                              Y: =551
                        - btn_comturn:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              DisplayMode: |-
                                =If(
                                    Count(comRandomNumbers) = 3 || Count(playerSelection) = 0,
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Fill: =RGBA(92, 37, 4, 1)
                              Font: =Font.'Open Sans'
                              Height: =50
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              OnSelect: |-
                                =ClearCollect(
                                    remainingPlaces,
                                    Filter(
                                        varSequence,
                                        Value <> 99 && Value <> 88
                                    )
                                );Set(varTimerStart,false);Set(varTimerStart,true)
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              Text: ="COM Turn"
                              Width: =150
                              X: =245
                              Y: =551
                        - timer_COM:
                            Control: Timer@2.1.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
                              DisabledColor: =ColorFade(Self.Fill, 90%)
                              DisabledFill: =ColorFade(Self.Fill, 70%)
                              Duration: =3000
                              Fill: =RGBA(56, 96, 178, 1)
                              Font: =Font.'Open Sans'
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              OnTimerEnd: |-
                                =UpdateContext({randomNumber: RandBetween(1,9)});
                                If(
                                    randomNumber in remainingPlaces,
                                    UpdateContext({comturncounter:comturncounter+1});
                                    Collect(comRandomNumbers,randomNumber);
                                    Update(varSequence,{Value: randomNumber},{Value: 88});
                                    Set(varTimerStart,false),
                                    Notify("Computer is taking time to decide....ZZZZZZZZ",NotificationType.Information,1000)
                                );
                                If(Count(comRandomNumbers) = 3,Select(btn_result))
                              OnTimerStart: =
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Repeat: =true
                              Start: =varTimerStart
                              Visible: =false
                              X: =45
                              Y: =534
                        - lbl_playerturncounter:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =Rectangle2.Fill
                              Font: =Font.'Open Sans'
                              Text: |-
                                =$"Player Turn Count: {playerTurnCounter}"
                              Width: =200
                              X: =97
                              Y: =442
                        - lbl_playerturncounter_1:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =Rectangle2.Fill
                              Font: =Font.'Open Sans'
                              Text: |-
                                =$"COM Turn Count: {comturncounter}"
                              Width: =200
                              X: =341
                              Y: =442
            - MainContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =5
                  LayoutGridColumnEnd: =-1
                  LayoutGridColumnStart: =6
                  LayoutGridRowEnd: =-1
                  LayoutGridRowStart: =2
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  X: =40
                  Y: =40
                Children:
                  - lbl_displayplayerNumbers:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =Button2.Fill
                        Font: =Font.'Open Sans'
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Text: ="Player Selected Numbers on Grid"
                  - table_player:
                      Control: ModernDataGrid@1.8.0
                      Properties:
                        DisplayMode: =DisplayMode.View
                        Items: =playerSelection
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        SelectMultiple: =false
                        ShowSelector: =false
                      Children:
                        - Value_Column1:
                            Control: ModernDataGridColumn@1.2.0
                            Variant: Number
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Value"
                              FieldName: ="Value"
                              FieldVariantName: ="numberColumn"
                              Value: =ThisItem.Value
                  - lbl_displaycomnumbers:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(214, 221, 224, 1)
                        Fill: =Button2.Fill
                        Font: =Font.'Open Sans'
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Text: ="Computer Selected Numbers on Grid"
                  - table_com:
                      Control: ModernDataGrid@1.8.0
                      Properties:
                        DisplayMode: =DisplayMode.View
                        Items: =comRandomNumbers
                        SelectMultiple: =false
                        ShowSelector: =false
                        X: =8
                        Y: =8
                      Children:
                        - Value_Column1_1:
                            Control: ModernDataGridColumn@1.2.0
                            Variant: Number
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="Value"
                              FieldName: ="Value"
                              FieldVariantName: ="numberColumn"
                              Value: =ThisItem.Value
      - Rectangle3:
          Control: Rectangle@2.3.0
          Group: OnLaunch
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            Visible: =showgif
            Width: =Parent.Width
      - Image1:
          Control: Image@2.2.3
          Group: OnLaunch
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =600
            Image: ='wired-outline-3185-tic-tac-toe'
            ImagePosition: =ImagePosition.Fill
            Visible: =showgif
            Width: =600
            X: =Parent.Width/2-Self.Width/2
            Y: =Parent.Height/2-Self.Height/2
      - timer_gif:
          Control: Timer@2.1.0
          Group: OnLaunch
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Duration: =5000
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnTimerEnd: =Set(showgif,false)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Start: =showgif
            Visible: =false
            X: =40
            Y: =40
      - Button1:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =Button2.Fill
            OnSelect: |-
              =Concurrent(Notify("🙂Let's Play Again",NotificationType.Information);
                  ClearCollect(
                      varSequence,
                      Sequence(
                          9,
                          1,
                          1
                      )
                  ),
                  ClearCollect(
                      winningCord,
                      {ID: 123},
                      {ID: 147},
                      {ID: 159},
                      {ID: 789},
                      {ID: 369},
                      {ID: 456},
                      {ID: 258},
                      {ID: 357}
                  ),
                  Clear(playerSelection),
                  Clear(comRandomNumbers),UpdateContext({comturncounter:0}),UpdateContext({playerTurnCounter:0})
              )
            Text: ="Play Again"
            X: =1176
            Y: =44
